# =============================================================================
# Reusable Workflow: Deploy Plugins
# =============================================================================
# Deploys plugins to a Dataverse environment using PPDS.Cli.
#
# Features:
#   - Drift detection (identifies changes between source and target)
#   - Uses PPDS.Cli for cross-platform deployment
#
# Usage:
#   jobs:
#     deploy:
#       uses: joshsmithxrm/ppds-alm/.github/workflows/plugin-deploy.yml@v1
#       with:
#         registration-file: ./registrations.json
#       secrets:
#         environment-url: ${{ vars.POWERPLATFORM_ENVIRONMENT_URL }}
#         tenant-id: ${{ vars.POWERPLATFORM_TENANT_ID }}
#         client-id: ${{ vars.POWERPLATFORM_CLIENT_ID }}
#         client-secret: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}
#
# =============================================================================

name: Deploy Plugins

on:
  workflow_call:
    inputs:
      registration-file:
        description: 'Path to plugin registrations JSON file'
        required: false
        type: string
        default: './registrations.json'
      detect-drift:
        description: 'Run drift detection before deployment'
        required: false
        type: boolean
        default: true
      ppds-cli-version:
        description: 'PPDS.Cli version to install (tested default: 1.4.1)'
        required: false
        type: string
        default: '1.4.1'

    secrets:
      environment-url:
        description: 'Power Platform environment URL'
        required: true
      tenant-id:
        description: 'Azure AD tenant ID'
        required: true
      client-id:
        description: 'Service principal client ID'
        required: true
      client-secret:
        description: 'Service principal client secret'
        required: true

    outputs:
      deployed:
        description: 'Whether plugins were deployed'
        value: ${{ jobs.deploy.outputs.deployed }}
      drift-detected:
        description: 'Whether drift was detected'
        value: ${{ jobs.deploy.outputs.drift-detected }}

jobs:
  deploy:
    name: Deploy Plugins
    runs-on: ubuntu-latest
    env:
      PPDS_PROFILE: alm-${{ github.run_id }}

    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      drift-detected: ${{ steps.drift.outputs.detected }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'

      - name: Install PPDS.Cli
        shell: bash
        env:
          CLI_VERSION: ${{ inputs.ppds-cli-version }}
        run: |
          echo "Installing PPDS.Cli..."
          CLI_VERSION="${CLI_VERSION:-1.4.1}"
          dotnet tool install --global PPDS.Cli --version "$CLI_VERSION"
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Verify installation
        shell: bash
        run: |
          ppds --version

      - name: Authenticate deployment profile
        id: auth
        shell: pwsh
        env:
          DATAVERSE_URL: ${{ secrets.environment-url }}
          CLIENT_ID: ${{ secrets.client-id }}
          CLIENT_SECRET: ${{ secrets.client-secret }}
          TENANT_ID: ${{ secrets.tenant-id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & ppds auth create --name $env:PPDS_PROFILE --environment $env:DATAVERSE_URL `
            --applicationId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET --tenant $env:TENANT_ID
          if ($LASTEXITCODE -ne 0) { throw "Plugin authentication failed (exit $LASTEXITCODE)." }

      - name: Detect drift
        id: drift
        if: inputs.detect-drift
        shell: pwsh
        env:
          DATAVERSE_URL: ${{ secrets.environment-url }}
          REGISTRATION_FILE: ${{ inputs.registration-file }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          # Keep stderr separate: stdout is the CLI's versioned JSON result.
          $json = & ppds plugins diff --config $env:REGISTRATION_FILE `
            --profile $env:PPDS_PROFILE --environment $env:DATAVERSE_URL --output-format Json
          $diffExit = $LASTEXITCODE
          try { $result = ($json -join [Environment]::NewLine) | ConvertFrom-Json -Depth 100 }
          catch { throw 'Drift detection returned invalid JSON; deployment stopped.' }
          if ($diffExit -notin 0, 1 -or $result.success -isnot [bool] -or -not $result.success -or
              $result.data -isnot [array] -or $result.data.Count -eq 0) {
            throw "Drift detection failed (exit $diffExit); deployment stopped."
          }
          $hasDrift = $false
          foreach ($assembly in $result.data) {
            if (-not $assembly.assemblyName -or $assembly.assemblyMissing -isnot [bool]) {
              throw 'Drift detection returned an unexpected assembly result; deployment stopped.'
            }
            $hasDrift = $hasDrift -or $assembly.assemblyMissing
            foreach ($field in @('missingSteps', 'orphanedSteps', 'modifiedSteps', 'missingImages', 'orphanedImages', 'modifiedImages')) {
              if ($assembly.$field -isnot [array]) {
                throw 'Drift detection returned an unexpected change list; deployment stopped.'
              }
              $hasDrift = $hasDrift -or $assembly.$field.Count -gt 0
            }
          }
          # Exit 1 means drift ONLY when accompanied by a successful, consistent result.
          if (($diffExit -eq 1) -ne $hasDrift) {
            throw 'Drift detection exit status does not match its result; deployment stopped.'
          }
          "detected=$($hasDrift.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($hasDrift) { Write-Warning 'Plugin drift detected; deployment will apply the configuration.' }
          $global:LASTEXITCODE = 0

      - name: Deploy plugins
        id: deploy
        shell: pwsh
        env:
          DATAVERSE_URL: ${{ secrets.environment-url }}
          REGISTRATION_FILE: ${{ inputs.registration-file }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $json = & ppds plugins deploy --config $env:REGISTRATION_FILE `
            --profile $env:PPDS_PROFILE --environment $env:DATAVERSE_URL --output-format Json
          if ($LASTEXITCODE -ne 0) { throw "Plugin deployment failed (exit $LASTEXITCODE)." }
          try { $result = ($json -join [Environment]::NewLine) | ConvertFrom-Json -Depth 100 }
          catch { throw 'Plugin deployment returned invalid JSON.' }
          if ($result.success -isnot [bool] -or -not $result.success) {
            throw 'Plugin deployment did not return a successful result.'
          }
          'deployed=true' >> $env:GITHUB_OUTPUT

      - name: Remove deployment profile
        id: cleanup
        if: always() && steps.auth.outcome != 'skipped'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & ppds auth delete --name $env:PPDS_PROFILE
          if ($LASTEXITCODE -ne 0) { throw "Could not remove the temporary deployment profile (exit $LASTEXITCODE)." }

      - name: Deployment summary
        shell: bash
        run: |
          echo "## Plugin Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Registration File | \`${{ inputs.registration-file }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Drift Detected | ${{ steps.drift.outputs.detected || 'Not checked' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed | ${{ steps.deploy.outputs.deployed }} |" >> $GITHUB_STEP_SUMMARY
